name: ci-autofix

# When a build workflow fails, run Claude Code with the ci-triage skill
# (.claude/skills/ci-triage): triage the run, and if the fix is within reach,
# open a fix PR against the failing branch and watch its checks. A human
# reviews and merges; this workflow never merges.
#
# Opt-in: does nothing until the repository has an ANTHROPIC_API_KEY secret.

on:
  workflow_run:
    workflows: [ci, cross-arm64, windows-msvc]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  triage-and-fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'fix/ci-')
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip without an API key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY not set; skipping AI triage. The failing job's summary still has the buildpulse triage bundle."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: env.HAS_KEY == 'true'
        with:
          python-version: "3.12"
      - if: env.HAS_KEY == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          pip install -e ".[dev]"
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            The "${{ github.event.workflow_run.name }}" workflow failed:
            run ${{ github.event.workflow_run.id }} (${{ github.event.workflow_run.html_url }})
            on branch "${{ github.event.workflow_run.head_branch }}" at ${{ github.event.workflow_run.head_sha }}.

            Follow the ci-triage skill in .claude/skills/ci-triage/SKILL.md end to end.
            Open a fix PR with base "${{ github.event.workflow_run.head_branch }}" if the fix is
            within reach, otherwise open an issue with the triage bundle. Never merge.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh:*),Bash(git:*),Bash(buildpulse:*),Bash(docker:*),Bash(pytest:*),Bash(ruff:*),Bash(cat:*),Bash(ls:*)"
