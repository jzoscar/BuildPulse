name: cross-arm64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .

      # Cache 1: Docker layers of the cross image, so it is only rebuilt when the
      # Dockerfile or toolchain files change.
      - uses: docker/setup-buildx-action@v4
      - name: Build cross toolchain image (GCC 12 + bookworm arm64 sysroot)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/cross-arm64.Dockerfile
          tags: buildpulse/cross-arm64
          load: true
          cache-from: type=gha,scope=cross-arm64
          cache-to: type=gha,mode=max,scope=cross-arm64

      # Cache 2+3: Conan package binaries and ccache objects, under ~/.cache/buildpulse.
      # Conan: keyed on the dependency inputs. ccache: a new entry every run, restored by prefix.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/buildpulse/conan2
          key: conan-arm64-${{ hashFiles('native/conanfile.py', 'toolchains/conan/*', 'docker/cross-arm64.Dockerfile') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/buildpulse/ccache
          key: ccache-arm64-${{ github.run_id }}
          restore-keys: ccache-arm64-

      - name: Cross-compile and test under QEMU
        run: buildpulse build --preset linux-arm64 --docker buildpulse/cross-arm64 --log-dir build-logs
      - name: Check the binary targets aarch64
        run: file native/build/linux-arm64/pulse | tee /dev/stderr | grep -q "ARM aarch64"
      - name: Triage on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p build-logs
          buildpulse triage latest --log-dir build-logs > build-logs/triage.md || true
          cat build-logs/triage.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-arm64-build
          path: |
            build-logs/
            !build-logs/latest
            native/build/linux-arm64/pulse
            native/build/linux-arm64/pulse_tests

  # Flash the aarch64 build onto a device borrowed from a LabForge rig pool and test it there.
  # Here the rig is LabForge's simulated lab running on the runner; on real hardware the same
  # `buildpulse device-test` runs on a self-hosted runner in the lab, against the lab's LabForge.
  device-test:
    needs: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Get LabForge
        id: labforge
        env:
          LABFORGE_TOKEN: ${{ secrets.LABFORGE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        run: |
          repo="github.com/jzoscar/LabForge.git"
          url="https://${LABFORGE_TOKEN:+x-access-token:${LABFORGE_TOKEN}@}${repo}"
          if git clone --depth 1 --quiet "$url" "$RUNNER_TEMP/labforge"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            msg="Device test skipped: LabForge is not reachable (private repository and no LABFORGE_TOKEN secret)."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.labforge.outputs.available == 'true'
        run: pip install -e . "$RUNNER_TEMP/labforge"
      - if: steps.labforge.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: linux-arm64-build
      - name: Start the simulated rig and LabForge
        if: steps.labforge.outputs.available == 'true'
        shell: bash
        env:
          LABFORGE_SECRET_SIM_BMC: admin:admin
          LABFORGE_IAC_PATH: ${{ runner.temp }}/labforge/infra
        run: |
          mkdir -p device-logs
          labforge sim run > device-logs/sim.log 2>&1 &
          labforge serve > device-logs/labforge.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
          labforge apply "$LABFORGE_IAC_PATH/test/sim-lab.yaml" -y
          labforge rig list
      - name: Flash and test on the device
        if: steps.labforge.outputs.available == 'true'
        run: >-
          buildpulse device-test --pool sim-sensor --firmware native/build/linux-arm64/pulse
          --log-dir device-logs -- sh -c 'curl -sf "$LABFORGE_DEVICE_HTTP/health"'
      - name: Triage on failure
        if: failure() && steps.labforge.outputs.available == 'true'
        shell: bash
        run: |
          buildpulse triage latest --log-dir device-logs > device-logs/triage.md || true
          cat device-logs/triage.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && steps.labforge.outputs.available == 'true'
        with:
          name: device-test
          path: |
            device-logs/
            !device-logs/latest

  # Manual (Actions > cross-arm64 > Run workflow): cold vs warm on the same runner, to measure what the caches buy.
  cache-benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: docker build -t buildpulse/cross-arm64 -f docker/cross-arm64.Dockerfile .
      - name: Cold (no caches)
        run: buildpulse build --preset linux-arm64 --docker buildpulse/cross-arm64 --no-cache --log-dir bench
      - name: Warm-up (fills Conan cache and ccache)
        run: buildpulse build --preset linux-arm64 --docker buildpulse/cross-arm64 --clean --log-dir bench
      - name: Warm (clean build tree, caches filled)
        run: buildpulse build --preset linux-arm64 --docker buildpulse/cross-arm64 --clean --log-dir bench
      - name: Compare cold vs warm
        run: |
          runs=($(ls -d bench/2* | sort))
          { echo '```'; buildpulse compare "${runs[0]}" "${runs[2]}"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
