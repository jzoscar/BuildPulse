name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  native-linux-x64:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - run: pip install -e ".[conan]"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/buildpulse/conan2
          key: conan-linux-x64-${{ hashFiles('native/conanfile.py') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/buildpulse/ccache
          key: ccache-linux-x64-${{ github.run_id }}
          restore-keys: ccache-linux-x64-
      - run: buildpulse build --preset host-release --log-dir build-logs
      - name: Triage on failure
        if: failure()
        shell: bash
        run: |
          buildpulse triage latest --log-dir build-logs > build-logs/triage.md || true
          cat build-logs/triage.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-x64-build
          path: |
            build-logs/
            !build-logs/latest
            native/build/host-release/pulse
